[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainmind"
version = "0.6.0"
description = "An autonomous AI agent whose resource consumption is governed by a verifiable blockchain ledger"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Nothing here is needed to run the system. The ledger, the agent, the model
# client and the dashboard are standard library only.
fast-crypto = ["cryptography>=41"]   # a faster Ed25519; a pure-Python one ships in-tree
dev = ["pytest>=7"]

[project.scripts]
chainmind = "chainmind.cli:main"

[tool.setuptools.packages.find]
include = ["chainmind*"]

[tool.setuptools.package-data]
chainmind = ["dashboard.html", "fonts/*.woff2", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
